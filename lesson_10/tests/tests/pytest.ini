[tool:pytest]
testpaths = test_suites
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --alluredir=../reports/allure-results
    --html=../reports/pytest-report.html
    --self-contained-html
markers =
    calculator: тесты калькулятора
    shopping: тесты магазина
    smoke: smoke тесты
    regression: regression тесты